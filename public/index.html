<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>NOTE BUZZ ENGINE v3.3.8</title>
<style>
/* ===== BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'SF Pro Text', 'Helvetica Neue', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: #f6f7fb;
  color: #2a2a3e;
  font-size: 13px;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}

/* ===== LAYOUT ===== */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: 56px 1fr 36px;
  height: 100vh;
}

/* ===== TOPBAR ===== */
.topbar {
  grid-column: 1 / -1;
  grid-row: 1;
  background: #ffffff;
  border-bottom: 1px solid #e5e7ee;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}
.logo {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #222;
  white-space: nowrap;
}
.logo em { color: #ff4466; font-style: normal; }
.v-tag {
  font-size: 9px;
  color: #9097b0;
  letter-spacing: 2px;
  padding: 3px 7px;
  border: 1px solid #e2e4ee;
  border-radius: 4px;
  background: #fafbfd;
}

/* Account tabs */
.acc-tabs {
  display: flex;
  gap: 4px;
  margin-left: 8px;
}
.acc-tab {
  background: #f1f2f7;
  border: 1px solid #e4e6ee;
  color: #6a7090;
  padding: 7px 14px;
  font-size: 10px;
  letter-spacing: 1.5px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 6px;
  transition: all .15s;
  font-weight: 600;
  white-space: nowrap;
}
.acc-tab:hover { border-color: #cdd1e0; color: #3b3e55; }
.acc-tab.active-ai {
  background: #eef2ff;
  border-color: #4f6af5;
  color: #2949d8;
}
.acc-tab.active-store {
  background: #ecfdf3;
  border-color: #1ec070;
  color: #0d8c4c;
}
.acc-tab.active-affi {
  background: #fff1ec;
  border-color: #ff6a3d;
  color: #d44a18;
}

.acc-info {
  font-size: 10px;
  color: #6a7090;
  letter-spacing: 0.5px;
  padding: 5px 10px;
  border-left: 2px solid #e4e6ee;
}
.acc-info b { color: #2a2a3e; font-weight: 700; }

/* Plan toggle */
.plan-toggle {
  display: flex;
  border: 1px solid #e4e6ee;
  border-radius: 6px;
  overflow: hidden;
  margin-left: auto;
}
.plan-btn {
  background: #fafbfd;
  border: none;
  color: #9097b0;
  padding: 6px 14px;
  font-size: 10px;
  letter-spacing: 2px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  transition: all .15s;
}
.plan-btn.active-free { background: #eef2ff; color: #2949d8; }
.plan-btn.active-paid { background: #fff5e0; color: #b57700; }

/* Level badge */
.level-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 5px 12px;
  border: 1px solid #e4e6ee;
  background: #fafbfd;
  border-radius: 6px;
  white-space: nowrap;
}
.lv1 { color: #2949d8; border-color: #c9d3ff; background: #eef2ff; }
.lv2 { color: #0d8c4c; border-color: #b8ead0; background: #ecfdf3; }
.lv3 { color: #b57700; border-color: #fbe1a0; background: #fff5e0; }
.lv4 { color: #d44a18; border-color: #fac7b5; background: #fff1ec; }
.lv5 { color: #c4104b; border-color: #f7b3c8; background: #fff0f5; }

/* Day counter */
.day-counter {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #6a7090;
  letter-spacing: 1px;
  background: #fafbfd;
  border: 1px solid #e4e6ee;
  border-radius: 6px;
  padding: 3px 6px;
}
.day-counter input {
  width: 40px;
  background: transparent;
  border: none;
  color: #2a2a3e;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  font-family: inherit;
  outline: none;
}

/* Quote indicator */
.quote-ind {
  font-size: 10px;
  letter-spacing: 1px;
  padding: 5px 10px;
  background: #fff5e0;
  border: 1px solid #fbe1a0;
  color: #b57700;
  border-radius: 6px;
  transition: all .2s;
}
.quote-ind.ready {
  background: #ecfdf3;
  border-color: #6fd9a3;
  color: #0d8c4c;
  animation: blink .8s ease-in-out infinite;
}
.quote-ind.disabled { opacity: 0.4; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

.trend-ind {
  font-size: 10px;
  letter-spacing: 1px;
  padding: 5px 10px;
  background: #f0ecff;
  border: 1px solid #d4c8ff;
  color: #5e3ad8;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  transition: all .15s;
  font-weight: 600;
}
.trend-ind.active { background: #5e3ad8; color: white; border-color: #5e3ad8; }
.trend-ind.disabled { opacity: 0.4; cursor: not-allowed; }

.yr-tag {
  font-size: 10px;
  letter-spacing: 2px;
  padding: 5px 10px;
  background: #ecfdf3;
  border: 1px solid #b8ead0;
  color: #0d8c4c;
  border-radius: 6px;
  font-weight: 700;
}

.cost-tag {
  font-size: 10px;
  letter-spacing: 1px;
  padding: 5px 10px;
  background: #fff1ec;
  border: 1px solid #ffcd9c;
  color: #d44a18;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
}
.cost-tag:hover { background: #ff6a3d; color: white; border-color: #ff6a3d; }

.hero-image {
  width: 100%;
  max-width: 600px;
  border-radius: 12px;
  margin-bottom: 16px;
  display: block;
  border: 1px solid #e5e7ee;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.image-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

/* Drag & Drop styles */
#preview.drag-over {
  background: rgba(111, 217, 163, 0.1);
  border: 2px dashed #0d8c4c;
}

.canva-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}
.canva-modal-overlay.open { display: flex; }
.canva-modal {
  background: #fff;
  border-radius: 14px;
  padding: 22px 20px;
  max-width: 480px;
  width: 94vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
}
.canva-modal h3 { margin: 0 0 12px; font-size: 15px; color: #1a2140; }
.canva-field-label { font-size: 10px; color: #6a7090; margin: 10px 0 3px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.canva-text-box {
  background: #f4f5f9;
  border: 1px solid #dde0ec;
  border-radius: 7px;
  padding: 8px 10px;
  font-size: 11px;
  font-family: monospace;
  white-space: pre-wrap;
  word-break: break-all;
  color: #2a3050;
  max-height: 120px;
  overflow-y: auto;
}
.canva-link-input {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid #c8cce0;
  border-radius: 7px;
  padding: 7px 10px;
  font-size: 12px;
  color: #1a2140;
  margin-top: 4px;
}
.canva-link-input:focus { outline: none; border-color: #4f6af5; }

.dup-warning {
  background: #fff5e0;
  border: 1px solid #fbe1a0;
  border-left: 4px solid #e8a020;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 11px;
  color: #8a4420;
  margin-bottom: 14px;
  line-height: 1.6;
}
.dup-warning b { color: #b57700; }

.cost-modal {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.cost-modal.show { display: flex; }
.cost-modal-body {
  background: white;
  padding: 24px;
  border-radius: 12px;
  min-width: 380px;
  max-width: 480px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.2);
}
.cost-modal h3 { font-size: 13px; letter-spacing: 2px; margin-bottom: 16px; color: #2a2a3e; }
.cost-modal table { width: 100%; font-size: 11px; }
.cost-modal td { padding: 6px 4px; border-bottom: 1px solid #f0f1f5; }
.cost-modal td.r { text-align: right; color: #d44a18; font-weight: 700; }
.cost-modal .big { font-size: 24px; color: #ff4466; font-weight: 800; margin: 10px 0; }

.feat-badge {
  font-size: 8px;
  padding: 2px 6px;
  border-radius: 8px;
  font-weight: 700;
  letter-spacing: 1px;
}
.feat-on { background: #ecfdf3; color: #0d8c4c; }
.feat-off { background: #ffecec; color: #c4104b; }

/* ===== SIDEBAR ===== */
.sidebar {
  grid-column: 1;
  grid-row: 2;
  min-height: 0;
  background: #ffffff;
  border-right: 1px solid #e5e7ee;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sec-label {
  font-size: 9px;
  letter-spacing: 2.5px;
  color: #9097b0;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 6px;
}

/* Buttons */
.btn-row { display: flex; flex-direction: column; gap: 4px; }
.btn-sm {
  background: #fafbfd;
  border: 1px solid #e4e6ee;
  color: #4a4e68;
  padding: 7px 10px;
  font-size: 11px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  border-radius: 6px;
  transition: all .12s;
  width: 100%;
}
.btn-sm:hover { border-color: #b8bed0; background: #f3f4f9; }
.btn-sm.active { background: #fff1ec; border-color: #ff6a3d; color: #d44a18; font-weight: 700; }

/* Type grid */
.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.type-btn {
  background: #fafbfd;
  border: 1px solid #e4e6ee;
  color: #4a4e68;
  padding: 8px 6px;
  font-size: 10px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 6px;
  transition: all .12s;
  line-height: 1.4;
  text-align: center;
}
.type-btn:hover { border-color: #b8bed0; background: #f3f4f9; }
.type-btn.active { background: #ecfdf3; border-color: #1ec070; color: #0d8c4c; font-weight: 700; }
.type-btn .sub {
  font-size: 8px;
  color: #9097b0;
  display: block;
  margin-top: 3px;
  font-weight: 500;
}
.type-btn.active .sub { color: #22a263; }

/* Persona grid */
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pbtn {
  background: #fafbfd;
  border: 1px solid #e4e6ee;
  color: #4a4e68;
  padding: 6px 6px;
  font-size: 10px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 6px;
  transition: all .12s;
  text-align: center;
}
.pbtn:hover { border-color: #b8bed0; }
.pbtn.active { background: #eef2ff; border-color: #4f6af5; color: #2949d8; font-weight: 700; }

/* Inputs */
input.kw-input, select.aff-select {
  width: 100%;
  background: #fafbfd;
  border: 1px solid #e4e6ee;
  color: #2a2a3e;
  padding: 8px 10px;
  font-size: 12px;
  font-family: inherit;
  border-radius: 6px;
  outline: none;
  transition: border .12s;
}
input.kw-input:focus, select.aff-select:focus { border-color: #4f6af5; background: white; }
select.aff-select {
  cursor: pointer;
  font-size: 11px;
}

/* Generate button */
.gen-btn {
  width: 100%;
  background: linear-gradient(135deg, #ff4466, #ff6a3d);
  border: none;
  color: white;
  padding: 12px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 3px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 8px;
  transition: all .15s;
  margin-top: auto;
  box-shadow: 0 4px 14px rgba(255, 68, 102, 0.25);
}
.gen-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(255, 68, 102, 0.35); }
.gen-btn:disabled { background: #d4d7e0; color: #9097b0; cursor: not-allowed; box-shadow: none; transform: none; }
.gen-btn.loading { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }

/* History */
.hist-pill {
  display: inline-block;
  background: #f3f4f9;
  border: 1px solid #e4e6ee;
  color: #6a7090;
  padding: 3px 8px;
  font-size: 9px;
  margin: 2px;
  border-radius: 10px;
}

/* Toggle options */
.toggle-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.toggle-chip {
  background: #fafbfd;
  border: 1px solid #e4e6ee;
  color: #6a7090;
  padding: 5px 10px;
  font-size: 10px;
  cursor: pointer;
  border-radius: 14px;
  font-family: inherit;
  transition: all .12s;
  font-weight: 600;
}
.toggle-chip.on {
  background: #f0ecff;
  border-color: #5e3ad8;
  color: #5e3ad8;
}

/* Meta banner */
.meta-banner {
  background: linear-gradient(135deg, #fff8e6, #fff1ec);
  border: 1px solid #ffcd9c;
  border-left: 4px solid #ff6a3d;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 10px;
  color: #8a4420;
  line-height: 1.6;
  display: none;
}
.meta-banner.show { display: block; }
.meta-banner b { color: #d44a18; }

/* ===== MAIN ===== */
.main {
  grid-column: 2;
  grid-row: 2;
  min-height: 0;
  background: #f6f7fb;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.tabs {
  display: flex;
  border-bottom: 1px solid #e5e7ee;
  background: #ffffff;
  padding: 0 4px;
}
.tab {
  padding: 12px 18px;
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 700;
  cursor: pointer;
  color: #9097b0;
  border: none;
  background: none;
  font-family: inherit;
  border-bottom: 2px solid transparent;
  transition: all .12s;
}
.tab:hover { color: #4a4e68; }
.tab.active { color: #2a2a3e; border-bottom-color: #ff4466; }
.tab .badge {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 6px;
  background: #ff4466;
  color: white;
  border-radius: 8px;
  font-size: 8px;
  vertical-align: middle;
}

.preview {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  scrollbar-width: thin;
  scrollbar-color: #d4d7e0 transparent;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 14px;
}
.empty-big {
  font-size: 40px;
  letter-spacing: 14px;
  color: #d4d7e0;
  font-weight: 800;
}
.empty-sub { font-size: 10px; letter-spacing: 3px; color: #b4b8c8; }

/* Quote card */
.quote-card {
  background: linear-gradient(135deg, #fff8e6, #fffdf3);
  border: 1px solid #fbe1a0;
  border-left: 4px solid #e8a020;
  padding: 12px 16px;
  margin-bottom: 16px;
  border-radius: 6px;
}
.quote-who { font-size: 9px; color: #8a6300; letter-spacing: 2px; margin-bottom: 6px; font-weight: 700; }
.quote-text { font-size: 12px; color: #6a4a00; line-height: 1.7; font-style: italic; }
.quote-src { font-size: 9px; color: #9c8045; margin-top: 6px; }
.quote-verify {
  display: inline-block;
  background: #ffdf85;
  color: #8a4420;
  font-size: 8px;
  padding: 1px 6px;
  margin-left: 6px;
  letter-spacing: 1px;
  border-radius: 4px;
  font-weight: 700;
}

/* Trend card */
.trend-card {
  background: linear-gradient(135deg, #f6f2ff, #fff5f5);
  border: 1px solid #d4c8ff;
  border-left: 4px solid #5e3ad8;
  padding: 12px 16px;
  margin-bottom: 16px;
  border-radius: 6px;
}
.trend-head { font-size: 9px; color: #5e3ad8; letter-spacing: 2px; font-weight: 800; margin-bottom: 6px; }
.trend-body { font-size: 11px; color: #4a3a7e; line-height: 1.7; white-space: pre-wrap; }

/* Review banner */
.review-banner {
  background: #fff5e0;
  border: 1px solid #fbe1a0;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 10px;
  color: #8a4420;
  margin-bottom: 12px;
  font-weight: 600;
}

/* Article preview */
.art-title {
  font-size: 17px;
  font-weight: 800;
  color: #1a1a2e;
  line-height: 1.5;
  border-left: 4px solid #ff4466;
  padding: 4px 14px;
  margin-bottom: 14px;
  flex: 1;
}
.art-meta {
  font-size: 10px;
  color: #9097b0;
  margin-bottom: 18px;
  letter-spacing: 1px;
  display: flex;
  gap: 14px;
  align-items: center;
  flex-wrap: wrap;
}
.plan-tag {
  font-size: 9px;
  padding: 3px 9px;
  letter-spacing: 1px;
  border-radius: 10px;
  font-weight: 700;
}
.plan-tag.free { background: #eef2ff; color: #2949d8; }
.plan-tag.paid { background: #fff5e0; color: #b57700; }
.series-tag {
  font-size: 9px;
  padding: 3px 9px;
  background: #f0ecff;
  color: #5e3ad8;
  border-radius: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

.art-body p { color: #3a3e55; font-size: 12px; margin-bottom: 10px; line-height: 1.95; }
.art-h2 { font-size: 13px; font-weight: 800; color: #1a1a2e; margin: 20px 0 8px; padding-bottom: 5px; border-bottom: 1px solid #e5e7ee; }
.art-step { background: #ecfdf3; border-left: 4px solid #1ec070; padding: 8px 12px; margin: 8px 0; font-size: 12px; color: #0a6a38; line-height: 1.7; border-radius: 4px; }
.art-li { padding: 3px 0 3px 12px; border-left: 2px solid #d4d7e0; color: #3a3e55; font-size: 12px; margin-bottom: 5px; }
.art-pro-tip {
  background: linear-gradient(135deg, #fff8e6, #fffdf3);
  border: 1px solid #fbe1a0;
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 12px;
  color: #8a6300;
  line-height: 1.7;
  border-radius: 6px;
}
.art-pro-tip::before {
  content: '▶ PRO TIP';
  font-size: 9px;
  color: #b57700;
  letter-spacing: 2px;
  display: block;
  margin-bottom: 5px;
  font-weight: 800;
}
.art-meta-note {
  background: #eef2ff;
  border-left: 4px solid #4f6af5;
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 11px;
  color: #2949d8;
  line-height: 1.7;
  border-radius: 6px;
}
.art-meta-note::before {
  content: '📮 MESSAGE';
  font-size: 9px;
  color: #4f6af5;
  letter-spacing: 2px;
  display: block;
  margin-bottom: 4px;
  font-weight: 800;
}

/* X posts */
.x-post {
  background: #ffffff;
  border: 1px solid #e5e7ee;
  padding: 12px 14px;
  margin-bottom: 8px;
  border-radius: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}
.x-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.x-num { font-size: 9px; color: #9097b0; letter-spacing: 2px; font-weight: 700; }
.x-chars { font-size: 9px; font-weight: 700; }
.x-text { font-size: 12px; color: #3a3e55; line-height: 1.75; white-space: pre-wrap; }
.x-role {
  display: inline-block;
  font-size: 8px;
  padding: 1px 6px;
  background: #f3f4f9;
  color: #6a7090;
  border-radius: 8px;
  margin-left: 4px;
  font-weight: 600;
}

.hashtag-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 12px 0;
  padding: 10px 14px;
  background: #ffffff;
  border: 1px solid #e5e7ee;
  border-radius: 8px;
}
.htag {
  background: #eef2ff;
  color: #2949d8;
  padding: 3px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
}
.htag.en { background: #f0ecff; color: #5e3ad8; }

/* Copy buttons */
.copy-btn {
  background: #f3f4f9;
  border: 1px solid #e4e6ee;
  color: #6a7090;
  padding: 3px 10px;
  font-size: 9px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 4px;
  transition: all .12s;
  white-space: nowrap;
  font-weight: 600;
}
.copy-btn:hover { color: #2a2a3e; border-color: #b8bed0; }
.copy-btn.ok { color: #0d8c4c; border-color: #6fd9a3; background: #ecfdf3; }
.all-copy {
  width: 100%;
  background: #ffffff;
  border: 1px solid #e4e6ee;
  color: #4a4e68;
  padding: 10px;
  font-size: 10px;
  letter-spacing: 2px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 6px;
  transition: all .15s;
  margin-top: 8px;
  font-weight: 700;
}
.all-copy:hover { border-color: #4f6af5; color: #2949d8; }

/* ===== STATUS BAR ===== */
.statusbar {
  grid-column: 1 / -1;
  grid-row: 3;
  background: #ffffff;
  border-top: 1px solid #e5e7ee;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 18px;
  font-size: 9px;
  color: #9097b0;
  letter-spacing: 1.5px;
  font-weight: 600;
}
.s-dot { width: 6px; height: 6px; border-radius: 50%; background: #d4d7e0; }
.s-dot.on { background: #1ec070; box-shadow: 0 0 6px #6fd9a3; }
.s-dot.err { background: #ff4466; }

/* 直近コピー内容（長めに表示） */
.copy-tray {
  display: none;
  position: fixed;
  z-index: 80;
  right: 10px;
  bottom: 12px;
  max-width: min(100vw - 20px, 440px);
  background: #1a1d2e;
  color: #eef0f7;
  border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.28);
  font-size: 11px;
  line-height: 1.45;
  overflow: hidden;
  border: 1px solid #3a3f55;
}
.copy-tray-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  background: #252a3f;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.04em;
}
.copy-tray-close {
  border: none;
  background: transparent;
  color: #aab;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  padding: 0 6px;
  font-family: inherit;
}
.copy-tray-body {
  margin: 0;
  padding: 10px 12px;
  max-height: 28vh;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: ui-monospace, monospace;
  font-size: 10px;
}
.copy-tray-meta {
  padding: 6px 12px 10px;
  font-size: 9px;
  color: #8b92a8;
}

/* モバイル下部 GENERATE */
.mobile-sticky-bar {
  display: none;
  position: sticky;
  bottom: 0;
  z-index: 45;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));

  border-top: 1px solid #e5e7ee;
  justify-content: center;
}
.gen-btn-mobile { margin: 0; max-width: 520px; }

.mobile-nav-jump {
  display: none;
}

/* ===== MOBILE / 〜960px（スマホ横・小型タブレットまで1カラム） ===== */

  .logo { font-size: 11px; }

  }

  /* モバイルクイックモード */
  .mq-type-btn {
    padding: 10px 14px; border-radius: 8px; border: 1.5px solid #e2e4ee;
    background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;

  }
  .mq-type-btn.mq-active {
    border-color: #2949d8; background: #eef1ff; color: #2949d8;

  @media (max-width: 400px) {

    .acc-tab { font-size: 10px; padding: 7px 4px; }
    #panelForm, #panelPreview { scroll-margin-top: 64px; }
  }
}

async function refreshCosts() {
  const ctrl = new AbortController();
  const t = setTimeout(function () { ctrl.abort(); }, 20000);
  try {
    const res = await fetch('/api/costs', { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    document.getElementById('costBig').textContent = '¥' + (j.total.jpy || 0).toLocaleString();
    document.getElementById('costTag').textContent = '¥' + (j.total.jpy || 0).toLocaleString();
    const rows = [
      ['24時間以内', '¥' + (j.last24h.jpy || 0).toLocaleString()],
      ['30日以内', '¥' + (j.last30d.jpy || 0).toLocaleString()],
      ['累計コール数', j.total.calls + '回'],
      ['為替レート', '$1 = ¥' + j.usd_jpy]
    ];
    let tbl = rows.map(r => `<tr><td>${r[0]}</td><td class="r">${r[1]}</td></tr>`).join('');
    tbl += '<tr><td colspan="2" style="padding-top:10px;color:#6a7090;font-size:9px;letter-spacing:2px">━━ 種類別 ━━</td></tr>';
    tbl += j.byKind.map(k => `<tr><td>${k.kind} <span style="color:#9097b0">(${k.n})</span></td><td class="r">¥${(k.jpy || 0).toLocaleString()}</td></tr>`).join('');
    document.getElementById('costTable').innerHTML = tbl;
  } catch (e) {
    const msg = (e && e.name === 'AbortError')
      ? 'タイムアウト（20秒）。サーバ起動中か回線が混み合っています。しばらく待って再タップ。'
      : '取得失敗: ' + ((e && e.message) || '');
    document.getElementById('costTable').innerHTML = '<tr><td>' + msg + '</td></tr>';
  } finally {
    clearTimeout(t);
  }
}

// ===== IMAGE UPLOAD =====
async function uploadImage() {
  if (!lastResult?.articleId) { alert('記事を先に生成してください'); return; }

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const base64Data = ev.target.result;
        const res = await fetch('/api/upload-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ articleId: lastResult.articleId, base64Data })
        });
        const j = await res.json();
        if (j.error) { alert('アップロード失敗: ' + j.error); return; }

        lastResult.imageUrl = j.imageUrl;
        lastResult.imageUrls = null;
        lastResult.multiImageNoteSet = false;
        delete lastResult.imagePrompt; // Remove prompt for uploaded image
        renderPreview();
        alert('画像がアップロードされました');
      } catch (e) {
        alert('エラー: ' + e.message);
      }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// ===== DRAG & DROP IMAGE UPLOAD =====
function setupImageDragDrop() {
  const preview = document.getElementById('preview');
  if (!preview) return;

  preview.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.stopPropagation();
    preview.classList.add('drag-over');
  });

  preview.addEventListener('dragleave', (e) => {
    e.preventDefault();
    e.stopPropagation();
    preview.classList.remove('drag-over');
  });

  preview.addEventListener('drop', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    preview.classList.remove('drag-over');

    if (!lastResult?.articleId) { alert('記事を先に生成してください'); return; }

    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (!files.length) { alert('画像ファイルをドロップしてください'); return; }

    for (const file of files) {
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const base64Data = ev.target.result;
          const res = await fetch('/api/upload-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ articleId: lastResult.articleId, base64Data })
          });
          const j = await res.json();
          if (j.error) { alert('アップロード失敗: ' + j.error); return; }

          lastResult.imageUrl = j.imageUrl;
          lastResult.imageUrls = null;
          lastResult.multiImageNoteSet = false;
          delete lastResult.imagePrompt;
          renderPreview();
        } catch (e) {
          alert('エラー: ' + e.message);
        }
      };
      reader.readAsDataURL(file);
    }
  });
}

      el.innerHTML = `<div class="empty-state"><div class="empty-big">HISTORY</div><div class="empty-sub">このアカウントでの生成履歴なし</div></div>`;

      const date = new Date(a.createdAt);
      return `<div class="x-post" style="cursor:pointer" onclick="loadArticle(${a.id})">
        <div style="display:flex;gap:12px;align-items:flex-start">
          ${a.imageUrl ? `<img src="${esc(a.imageUrl)}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;flex-shrink:0">` : ''}

              ${date.getFullYear()}/${pad(date.getMonth()+1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}
            </div>

        </div>
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = '<div style="padding:40px;color:#cc3344">取得失敗</div>';

}

async function loadArticle(id) {
  try {
    const res = await fetch('/api/articles/' + id);
    const a = await res.json();
    lastResult = {
      articleId: a.id,
      account: a.account,
      title: a.title, article: a.article,
      xPosts: a.x_posts, hashtags: a.hashtags,
      plan: a.plan, dayNumber: a.day, level: a.level,
      levelTag: `LV.${a.level}`, seriesLabel: `DAY ${a.day} / LV.${a.level}`,
      accountHandle: accountDirectory?.[a.account]?.handle || '',
      imageUrl: a.image_url,
      imageUrls: (a.meta && a.meta.imageUrls) || null,
      multiImageNoteSet: !!(a.meta && a.meta.multiImageNoteSet),
      imageBrief: a.meta?.imageBrief || null,
      reviewMode: a.meta?.reviewMode,
      trendFetched: a.meta?.trendFetched,
      affiliateLinks: [],
      trendingTags: []
    };
    // switch to article tab
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.tab').classList.add('active');
    curTab = 'article';
    renderPreview();
  } catch (e) { alert(e.message); }
}

function setPlan(p, save = true) {

  document.getElementById('planPaid').className = 'plan-btn' + (p === 'paid' ? ' active-paid' : '');

function switchTab(el, tab) {

function setStatus(s, txt) {
  document.getElementById('sDot').className = 's-dot' + (s === 'on' ? ' on' : s === 'err' ? ' err' : '');
  document.getElementById('sTxt').textContent = txt;
}

function updateQuoteInd() {
  const info = accountDirectory?.[st.account];
  if (!info?.allowQuote) {
    document.getElementById('quoteInd').className = 'quote-ind disabled';
    return;
  }
  const rem = st.nextQuoteAt - st.totalGens;
  document.getElementById('quoteCnt').textContent = Math.max(0, rem);

    'quote-ind' + (rem <= 0 ? ' ready' : '');

function updateHistList() {
  const sec = document.getElementById('histSec');
  const list = document.getElementById('histList');
  const hist = st.hist[st.account] || [];
  if (!hist.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';

    .map(h => `<span class="hist-pill">${esc((h.title || '').slice(0, 18) + '…')}</span>`)

// ===== GENERATE =====
async function generate() {
  const kw = document.getElementById('kw').value.trim();
  if (!kw) { document.getElementById('kw').focus(); return; }

  const btn = document.getElementById('genBtn');
  const btnM = document.getElementById('genBtnMobile');
  btn.disabled = true;
  btn.textContent = '■ GENERATING...';
  btn.classList.add('loading');
  if (btnM) { btnM.disabled = true; btnM.textContent = '■ GENERATING...'; btnM.classList.add('loading'); }
  setStatus('on', st.useTrend ? 'TREND+GEN' : 'GENERATING');

  const info = accountDirectory?.[st.account] || {};
  const useQuote = info.allowQuote && (st.totalGens >= st.nextQuoteAt);
  const recentTitles = (st.hist[st.account] || []).slice(-5).map(h => h.title).filter(Boolean);

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        account: st.account,
        keyword: kw,
        articleType: st.type,
        persona: st.persona,
        affiliate: st.affiliate,
        plan: st.plan,
        dayNumber: st.day,
        recentTitles,
        useQuote,
        useTrend: st.useTrend,
        useImage: st.useImage,
        imageMode: st.useImage ? (st.imageMode || 'dalle') : 'dalle',
        imageSlot: st.useImage ? (st.imageSlot || 'hero') : 'hero',
        multiImageNoteSet: !!(st.useImage && (st.imageMode || 'dalle') === 'dalle' && st.multiImageNoteSet),
        forceReview: st.forceReview,
        metaInsertion: st.forceMeta ? (st._metaHint || null) : null,
        currentYear: CY
      })
    });

    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'Unknown error');

    const d = json.data;
    lastResult = d;

    st.totalGens += 1;
    if (!st.hist[st.account]) st.hist[st.account] = [];
    st.hist[st.account].push({ title: d.title, date: Date.now() });
    if (st.hist[st.account].length > 12) st.hist[st.account] = st.hist[st.account].slice(-12);
    if (useQuote) st.nextQuoteAt = st.totalGens + randQ();
    saveSt();

    const wc = (d.article || '').replace(/\s/g, '').length;
    document.getElementById('wcSt').textContent = wc.toLocaleString();
    document.getElementById('gcSt').textContent = st.totalGens;
    updateQuoteInd();
    updateHistList();
    const nUrls = (d.imageUrls && typeof d.imageUrls === 'object') ? Object.keys(d.imageUrls).filter(k => d.imageUrls[k]).length : 0;
    const imTag = nUrls >= 2 ? (` +IMG×${nUrls}`) : (d.imageUrl ? ' +IMG' : ((d.imageBrief) ? ' +BRIEF' : ''));
    setStatus('on', `DONE — ${d.levelTag}${d.reviewMode ? ' [REVIEW]' : ''}${d.trendFetched ? ' +TREND' : ''}${imTag}`);
    renderPreview();
    refreshCosts();
    if (typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 960px)').matches) {
      document.getElementById('panelPreview')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  } catch (err) {
    console.error(err);
    setStatus('err', 'ERROR: ' + err.message.slice(0, 60));
  }

  btn.disabled = false;
  btn.textContent = '▶ GENERATE';
  btn.classList.remove('loading');
  if (btnM) {
    btnM.disabled = false;
    btnM.textContent = '▶ GENERATE';
    btnM.classList.remove('loading');
  }
}

let copyTrayHideTimer = null;
function dismissCopyTray() {
  const root = document.getElementById('copyTray');
  if (root) root.style.display = 'none';
  if (copyTrayHideTimer) {
    clearTimeout(copyTrayHideTimer);
    copyTrayHideTimer = null;
  }
}
function showCopyTray(text) {
  const root = document.getElementById('copyTray');
  const body = document.getElementById('copyTrayBody');
  const meta = document.getElementById('copyTrayMeta');
  if (!root || !body || !meta) return;
  const str = String(text ?? '');
  body.textContent = str;
  meta.textContent = str.length ? `${str.length.toLocaleString()} 文字 — 約30分で自動クローズ（×で即閉じ）` : '';
  root.style.display = 'block';
  if (copyTrayHideTimer) clearTimeout(copyTrayHideTimer);
  copyTrayHideTimer = setTimeout(dismissCopyTray, COPY_TRAY_TTL_MS);
}

function cpText(text, btn) {
  const s = String(text ?? '');
  const onDone = () => {
    showCopyTray(s);
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = '✓ COPIED';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('ok'); }, COPY_BTN_OK_MS);
    }
  };
  const fallbackExec = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = s;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      onDone();
    } catch (_) {
      showCopyTray(s + '\n\n（クリップボードにコピーできない環境の可能性。ここを長押し→コピー）');
      if (btn) alert('自動コピーに失敗しました。画面上のパネルを長押ししてコピーしてください。');
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(onDone).catch(fallbackExec);
  } else {
    fallbackExec();
  }
}

    document.getElementById('canvaHowTo').textContent = (d.canvaSpec && d.canvaSpec.howTo) || '';
    document.getElementById('canvaExistingLink').value = d.canvaDesignId || '';
    document.getElementById('canvaModalOverlay').classList.add('open');
  } catch (e) {
    alert('Canva エクスポート失敗: ' + e.message);
  }
}

function closeCanvaPanel() {
  document.getElementById('canvaModalOverlay').classList.remove('open');
}

async function saveCanvaLink() {
  const link = document.getElementById('canvaExistingLink').value.trim();
  if (!link) return alert('CanvaのURLまたはIDを入力してください');
  if (!canvaArticleId) return;
  try {
    const r = await fetch('/api/canva-link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ articleId: canvaArticleId, canvaDesignId: link })
    });
    const d = await r.json();
    if (d.error) return alert('保存失敗: ' + d.error);
    alert('✅ Canvaリンクを保存しました');
    closeCanvaPanel();
  } catch (e) {
    alert('保存エラー: ' + e.message);
  }
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
function pad(n) { return String(n).padStart(2, '0'); }

// ===== モバイルクイックモード =====
let _mqType = 'guide';
let _mqImage = 'dalle';

function mqPickType(el) {
  document.querySelectorAll('#mq-types .mq-type-btn').forEach(b => b.classList.remove('mq-active'));
  el.classList.add('mq-active');
  _mqType = el.dataset.v;
}
function mqPickImage(el) {
  el.parentElement.querySelectorAll('.mq-type-btn').forEach(b => b.classList.remove('mq-active'));
  el.classList.add('mq-active');
  _mqImage = el.dataset.im;
}

async function mqGenerate() {
  const kw = document.getElementById('mq-kw').value.trim();
  if (!kw) { document.getElementById('mq-kw').focus(); return; }
  const btn = document.getElementById('mq-gen-btn');
  const status = document.getElementById('mq-status');
  const result = document.getElementById('mq-result');
  btn.disabled = true; btn.textContent = '⏳ 生成中...';
  status.textContent = 'AIが記事を生成しています（30秒〜1分）';
  result.innerHTML = '';

  // メイン画面のstateを同期
  document.getElementById('kw').value = kw;
  const st = loadSt();
  st.type = _mqType;
  st.imageMode = _mqImage === 'none' ? 'dalle' : _mqImage;
  st.useImage = _mqImage !== 'none';
  saveSt(st);

  try {
    await generate();
    // 結果をクイックモードに表示
    if (lastResult) {
      result.innerHTML = `
        <div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)">
          <div style="font-size:16px;font-weight:800;color:#222;margin-bottom:8px">${esc(lastResult.title || '')}</div>
          ${lastResult.imageUrl ? `<img src="${lastResult.imageUrl}" style="width:100%;border-radius:8px;margin-bottom:12px">` : ''}
          <div style="font-size:13px;color:#6a7090;line-height:1.8;max-height:300px;overflow-y:auto;white-space:pre-wrap">${esc((lastResult.article || '').slice(0, 500))}${(lastResult.article||'').length > 500 ? '...' : ''}</div>
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
            <button onclick="closeMobileQuick()" style="flex:1;padding:12px;background:#2949d8;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">通常画面で全文確認</button>
            ${lastResult.article ? `<button onclick="navigator.clipboard.writeText(lastResult.article);this.textContent='✅'" style="padding:12px 16px;background:#eef1ff;color:#2949d8;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">📋 コピー</button>` : ''}
          </div>
        </div>`;
      status.textContent = '✅ 生成完了';
    }
  } catch (e) {
    status.textContent = '❌ ' + (e.message || '生成に失敗しました');
  } finally {
    btn.disabled = false; btn.textContent = '▶ ワンタップ生成';
  }
}

function closeMobileQuick() {
  document.getElementById('mobileQuickMode').style.display = 'none';
  document.body.style.overflow = '';
}

// モバイル: クイックモードは手動切替（自動起動で白画面になる問題を修正）
function openMobileQuick() {
  document.getElementById('mobileQuickMode').style.display = '';
  document.body.style.overflow = 'hidden';
}
if (window.innerWidth <= 960) {
  window.addEventListener('DOMContentLoaded', () => {
    const bar = document.getElementById('mobileStickyBar');
    if (bar) {
      const qBtn = document.createElement('button');
      qBtn.textContent = '📱 クイック生成';
      qBtn.style.cssText = 'margin-left:8px;padding:10px 16px;background:#fff;border:1.5px solid #2949d8;border-radius:8px;color:#2949d8;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit';
      qBtn.onclick = openMobileQuick;
      bar.appendChild(qBtn);
    }
  });
}
</script>
